name: samvaad-enterprise-staging
services:
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
  frontend:
    build:
      context: ../..
      dockerfile: infra/enterprise/Dockerfile
    command: ["streamlit", "run", "public_app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      SAMVAAD_PUBLIC_GUARD_PATH: /data/public-guard.db
    volumes:
      - public-state:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  api:
    build:
      context: ../..
      dockerfile: infra/enterprise/Dockerfile
    env_file:
      - path: ../../.local/enterprise.env
        required: false
    environment:
      SAMVAAD_BACKEND: local
      SAMVAAD_DB_PATH: /data/pilot.db
    volumes:
      - operational-state:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
volumes:
  public-state:
  operational-state:
