# Managed-host staging ingress. Only this gateway publishes a port.
# TCP peer IP is authoritative here; arbitrary forwarded IPs are ignored.
worker_processes auto;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=5r/s;
    limit_req_zone $server_name zone=global:10m rate=40r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream workspace { server frontend:8501; }
    upstream application { server api:8000; }
    server {
        listen 8080;
        limit_req zone=per_ip burst=30 nodelay;
        limit_req zone=global burst=80 nodelay;
        limit_req_status 429;
        limit_conn connections 20;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Samvaad-Client-IP "";
        proxy_set_header X-Samvaad-Timestamp "";
        proxy_set_header X-Samvaad-Signature "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        location /api/ { proxy_pass http://application; proxy_read_timeout 30s; }
        location = /api/relationship/sync/preview {
            client_max_body_size 1m;
            proxy_pass http://application;
            proxy_read_timeout 30s;
        }
        location /portal/ { proxy_pass http://application; proxy_read_timeout 15s; }
        location /telephony/ { proxy_pass http://application; proxy_read_timeout 15s; }
        location /health { proxy_pass http://application; }
        location / {
            proxy_pass http://workspace;
            proxy_read_timeout 300s;
        }
    }
}
