name: Diagnose Snowflake hosted runtime

on:
  workflow_dispatch:
    inputs:
      repair_main_live:
        description: 'Restore only a missing main-app live copy from its committed version'
        type: boolean
        default: false
      publish_pinned_check:
        description: 'Publish a separate check app with the catalog-verified Python patch version'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && vars.SAMVAAD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: SAMVAAD_GITHUB_DEPLOYER
      SNOWFLAKE_ROLE: SAMVAAD_HACKATHON
      SNOWFLAKE_WAREHOUSE: SAMVAAD_XS
      SNOWFLAKE_DATABASE: SAMVAAD_STAGING
      SNOWFLAKE_SCHEMA: APP
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: snowflakedb/snowflake-actions@v3.0.0
        with:
          cli-version: '3.16.0'
          use-oidc: true
      - name: Inspect package metadata and temporary runtime functions
        run: python -m scripts.diagnose_github_runtime
      - name: Restore the main-app live copy if unavailable
        if: inputs.repair_main_live
        run: python -m scripts.ensure_github_live_version
      - name: Publish the separate pinned-runtime check
        if: inputs.publish_pinned_check
        run: |
          python -m scripts.package_github_release --account "$SNOWFLAKE_ACCOUNT" --viewer "ARUNVPP24" --mode runtime-pinned-check
          snow sql -x -f output/cloud/github/04-release.sql
