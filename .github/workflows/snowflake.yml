name: Test and deploy Samvaad 360

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: 'Update the app or create a minimal default-runtime diagnostic'
        type: choice
        options: [app, runtime-check]
        default: app

permissions:
  contents: read

concurrency:
  group: samvaad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-cloud.txt
      - name: Test local workflows and cloud boundaries
        run: python -m pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SAMVAAD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: SAMVAAD_GITHUB_DEPLOYER
      SNOWFLAKE_ROLE: SAMVAAD_HACKATHON
      SNOWFLAKE_WAREHOUSE: SAMVAAD_XS
      SNOWFLAKE_DATABASE: SAMVAAD_STAGING
      SNOWFLAKE_SCHEMA: APP
      SAMVAAD_VIEWER: ${{ vars.SAMVAAD_VIEWER }}
      SAMVAAD_DEPLOYMENT_MODE: ${{ inputs.deployment_mode || 'app' }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Configure Snowflake CLI and short-lived OIDC authentication
        uses: snowflakedb/snowflake-actions@v3.0.0
        with:
          cli-version: '3.16.0'
          use-oidc: true
      - name: Validate non-secret deployment settings
        shell: bash
        run: |
          test -n "$SNOWFLAKE_ACCOUNT"
          test -n "$SAMVAAD_VIEWER"
      - name: Package only the hosted app files
        shell: bash
        run: python -m scripts.package_github_release --account "$SNOWFLAKE_ACCOUNT" --viewer "$SAMVAAD_VIEWER" --mode "$SAMVAAD_DEPLOYMENT_MODE"
      - name: Check connection and update the existing app
        shell: bash
        run: |
          snow connection test -x
          snow sql -x -f output/cloud/github/04-release.sql
